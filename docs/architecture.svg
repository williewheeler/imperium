<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="900"/>

  <!-- Person -->
  <rect class="box" x="60" y="20" width="520" height="45" rx="6"/><text class="t" x="320" y="40" text-anchor="middle">Person</text><text class="s" x="320" y="56" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>

  <!-- Client -->
  <rect class="grp" x="30" y="95" width="580" height="120" rx="10"/>
  <text class="h" x="45" y="116">Client</text>
  <rect class="box" x="60" y="130" width="240" height="70" rx="6"/><text class="t" x="180" y="154" text-anchor="middle">Views</text><text class="s" x="180" y="172" text-anchor="middle">world, units, fog, minimap,</text><text class="s" x="180" y="186" text-anchor="middle">HUD readouts, messages</text>
  <rect class="box" x="340" y="130" width="240" height="70" rx="6"/><text class="t" x="460" y="154" text-anchor="middle">Controls</text><text class="s" x="460" y="172" text-anchor="middle">mouse, keys, selection, buttons:</text><text class="s" x="460" y="186" text-anchor="middle">make commands</text>

  <!-- Channels -->
  <rect class="prop" x="60" y="245" width="240" height="75" rx="6"/><text class="t" x="180" y="268" text-anchor="middle">View channel</text><text class="s" x="180" y="285" text-anchor="middle">asynchronous, host to client</text><text class="s" x="180" y="300" text-anchor="middle">in-process queue, or NetSession</text>
  <rect class="prop" x="340" y="245" width="240" height="75" rx="6"/><text class="t" x="460" y="268" text-anchor="middle">Command channel</text><text class="s" x="460" y="285" text-anchor="middle">asynchronous, client to host</text><text class="s" x="460" y="300" text-anchor="middle">in-process queue, or NetSession</text>

  <!-- Key -->
  <rect class="grp" x="650" y="95" width="530" height="120" rx="10"/>
  <text class="h" x="665" y="116">Key</text>
  <path class="l" d="M670,138 L720,138"/><text class="s" x="730" y="142">a call</text>
  <path class="d" d="M670,160 L720,160"/><text class="s" x="730" y="164">a signal, or a listener that does not take part</text>
  <rect class="prop" x="670" y="174" width="50" height="24" rx="4"/><text class="s" x="730" y="186">proposed, not built. Today the Controls, AIs and Replayer call</text>
  <text class="s" x="730" y="201">Commands directly, and Views read the Simulation directly.</text>

  <!-- Host -->
  <rect class="grp" x="30" y="345" width="1150" height="540" rx="10"/>
  <text class="h" x="1165" y="368" text-anchor="end">Host  (where the one simulation runs)</text>

  <!-- above the simulation -->
  <rect class="prop" x="60" y="385" width="240" height="60" rx="6"/><text class="t" x="180" y="409" text-anchor="middle">View publisher</text><text class="s" x="180" y="427" text-anchor="middle">puts the signals on the channel</text>
  <rect class="prop" x="340" y="385" width="240" height="60" rx="6"/><text class="t" x="460" y="409" text-anchor="middle">Command receiver</text><text class="s" x="460" y="427" text-anchor="middle">takes commands off the channel</text>
  <rect class="box" x="620" y="385" width="100" height="60" rx="6"/><text class="t" x="670" y="420" text-anchor="middle">AIs</text>
  <rect class="box" x="740" y="385" width="100" height="60" rx="6"/><text class="t" x="790" y="420" text-anchor="middle">Replayer</text>
  <rect class="box" x="880" y="385" width="270" height="60" rx="6"/><text class="t" x="1015" y="406" text-anchor="middle">Tick driver</text><text class="s" x="1015" y="423" text-anchor="middle">turns wall-clock time into ticks</text><text class="s" x="1015" y="437" text-anchor="middle">(Main, the headless runner, Replayer)</text>

  <!-- the simulation -->
  <rect class="sim" x="45" y="480" width="1120" height="320" rx="10"/>
  <text class="s" x="350" y="790">src/sim: no scene, no clock</text><text class="h" x="60" y="503">Simulation</text>
  <rect class="box" x="60" y="520" width="240" height="125" rx="6"/><text class="t" x="180" y="543" text-anchor="middle">Game systems</text><text class="s" x="180" y="565" text-anchor="middle">Movement, Economy, Production,</text><text class="s" x="180" y="581" text-anchor="middle">Eras, Vision, Wildlife,</text><text class="s" x="180" y="597" text-anchor="middle">UnitBehavior, Combat, Orders,</text><text class="s" x="180" y="613" text-anchor="middle">Placement, Roads, Victory</text><text class="s" x="180" y="634" text-anchor="middle">(the rules, run on the state)</text>
  <rect class="box" x="60" y="660" width="240" height="125" rx="6"/><text class="t" x="180" y="683" text-anchor="middle">Game state</text><text class="s" x="180" y="705" text-anchor="middle">units, buildings, stocks,</text><text class="s" x="180" y="721" text-anchor="middle">fogs, rng, the tick count</text><text class="s" x="180" y="741" text-anchor="middle">GameMap, Fog, Defs</text>

  <rect class="prop" x="340" y="520" width="500" height="60" rx="6"/><text class="t" x="590" y="543" text-anchor="middle">Command interface</text><text class="s" x="590" y="560" text-anchor="middle">accepts a command from anyone and queues it</text><text class="s" x="590" y="573" text-anchor="middle">(today: Commands.submit, which answers at once)</text>
  <rect class="prop" x="340" y="600" width="500" height="50" rx="6"/><text class="t" x="590" y="622" text-anchor="middle">Command queue</text><text class="s" x="590" y="639" text-anchor="middle">drained at the start of each tick, in order</text>
  <rect class="box" x="340" y="670" width="500" height="50" rx="6"/><text class="t" x="590" y="692" text-anchor="middle">Commands</text><text class="s" x="590" y="709" text-anchor="middle">validate, pay, apply to the state</text>
  <rect class="box" x="880" y="520" width="270" height="130" rx="6"/><text class="t" x="1015" y="545" text-anchor="middle">Simulation.step()</text><text class="s" x="1015" y="571" text-anchor="middle">one tick, 1/30 s of game time:</text><text class="s" x="1015" y="587" text-anchor="middle">drains the queue, then runs the</text><text class="s" x="1015" y="603" text-anchor="middle">systems over the state</text><text class="s" x="1015" y="629" text-anchor="middle">the clock is the tick count</text>

  <!-- below -->
  <rect class="box" x="540" y="825" width="610" height="50" rx="6"/><text class="t" x="845" y="847" text-anchor="middle">Recorder</text><text class="s" x="845" y="864" text-anchor="middle">writes the drained commands and a checksum every 5 s to a file</text>

  <!-- arrows -->
  <path class="l" d="M460,65 L460,130"/>
  <path class="l" d="M180,130 L180,65"/>
  <path class="l" d="M460,200 L460,245"/>
  <path class="l" d="M180,245 L180,200"/>
  <path class="l" d="M460,320 L460,385"/>
  <path class="l" d="M180,385 L180,320"/>
  <path class="d" d="M180,480 L180,445"/><text class="s" x="195" y="468">signals</text>
  <path class="l" d="M460,445 L460,520"/>
  <path class="l" d="M670,445 L670,520"/>
  <path class="l" d="M790,445 L790,520"/>
  <path class="l" d="M1015,445 L1015,520"/>
  <path class="l" d="M590,580 L590,600"/>
  <path class="l" d="M590,650 L590,670"/>
  <path class="l" d="M880,625 L840,625"/>
  <path class="l" d="M340,695 L300,695"/>
  <path class="d" d="M650,720 L650,825"/><text class="s" x="662" y="790">submitted</text>
  <path class="d" d="M1015,650 L1015,825"/><text class="s" x="1027" y="790">stepped</text>
</svg>
