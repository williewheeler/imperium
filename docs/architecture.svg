<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .box{fill:#fff;stroke:#444;stroke-width:1.5;rx:6}
      .grp{fill:#f4f1ea;stroke:#999;stroke-width:1.2;rx:10}
      .sim{fill:#e9f0f7;stroke:#5b7fa6;stroke-width:1.5;rx:10}
      .ch{fill:#eef6ee;stroke:#6a9a6a;stroke-width:1.2;rx:10}
      .t{fill:#222}.s{fill:#666;font-size:11px}.h{font-weight:bold;fill:#333;font-size:14px}
      .l{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .d{stroke:#444;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .prop{fill:#fff8e1;stroke:#c9a227;stroke-width:1.5;stroke-dasharray:6 4;rx:6}
    </style>
  </defs>

  <!-- Client -->
  <rect class="grp" x="15" y="15" width="300" height="590"/>
  <text class="h" x="30" y="40">Client  (src/client, views, ui)</text>
  <rect class="box" x="40" y="55" width="250" height="50"/><text class="t" x="165" y="76" text-anchor="middle">UI</text><text class="s" x="165" y="93" text-anchor="middle">HUD buttons, menus</text>
  <rect class="box" x="40" y="125" width="250" height="50"/><text class="t" x="165" y="146" text-anchor="middle">Person</text><text class="s" x="165" y="163" text-anchor="middle">mouse, keys, selection: makes commands</text>
  <rect class="prop" x="40" y="185" width="250" height="60"/><text class="t" x="165" y="209" text-anchor="middle">Command endpoint</text><text class="s" x="165" y="227" text-anchor="middle">proposed: Person calls Commands directly today</text>
  <rect class="box" x="40" y="320" width="250" height="100"/><text class="t" x="165" y="345" text-anchor="middle">Main, views/, ui/</text><text class="s" x="165" y="364" text-anchor="middle">draw the state, show messages,</text><text class="s" x="165" y="378" text-anchor="middle">play the music</text><text class="s" x="165" y="400" text-anchor="middle">(today they read the Simulation directly)</text>
  <rect class="prop" x="40" y="500" width="250" height="60"/><text class="t" x="165" y="524" text-anchor="middle">Update endpoint</text><text class="s" x="165" y="542" text-anchor="middle">proposed: receives state and events</text>
  <path class="l" d="M165,105 L165,125"/><path class="l" d="M165,175 L165,185"/><path class="l" d="M165,500 L165,420"/>

  <!-- Channels -->
  <rect class="ch" x="345" y="150" width="230" height="130"/>
  <text class="h" x="460" y="175" text-anchor="middle">Command channel</text>
  <text class="s" x="460" y="195" text-anchor="middle">client to host</text>
  <text class="s" x="460" y="250" text-anchor="middle">a direct call (single player,</text><text class="s" x="460" y="264" text-anchor="middle">the host's own player), or NetSession</text>
  <rect class="ch" x="345" y="470" width="230" height="130"/>
  <text class="h" x="460" y="495" text-anchor="middle">Update channel</text>
  <text class="s" x="460" y="515" text-anchor="middle">host to client</text>
  <text class="s" x="460" y="570" text-anchor="middle">a direct call (single player,</text><text class="s" x="460" y="584" text-anchor="middle">the host's own player), or NetSession</text>

  <!-- Host -->
  <rect class="grp" x="600" y="15" width="585" height="590"/>
  <text class="h" x="615" y="40">Host  (where the one simulation runs)</text>
  <rect class="box" x="625" y="55" width="110" height="40"/><text class="t" x="680" y="80" text-anchor="middle">AIs</text>
  <rect class="box" x="755" y="55" width="130" height="40"/><text class="t" x="820" y="80" text-anchor="middle">Replayer</text>
  <text class="s" x="905" y="72">AIs read the world through</text><text class="s" x="905" y="86">their own Fog</text>
  <rect class="box" x="625" y="150" width="260" height="70"/><text class="t" x="755" y="176" text-anchor="middle">Commands.submit</text><text class="s" x="755" y="196" text-anchor="middle">validate, pay, apply</text>
  <rect class="box" x="940" y="150" width="215" height="70"/><text class="t" x="1047" y="176" text-anchor="middle">Recorder</text><text class="s" x="1047" y="194" text-anchor="middle">writes the commands and</text><text class="s" x="1047" y="208" text-anchor="middle">checksums to a file</text>

  <rect class="sim" x="625" y="260" width="530" height="210"/>
  <text class="h" x="641" y="285">Simulation  (src/sim: no scene, no clock)</text>
  <rect class="box" x="645" y="300" width="490" height="40"/><text class="t" x="890" y="325" text-anchor="middle">Simulation.step()   units, buildings, stocks, fogs, rng</text>
  <rect class="box" x="645" y="350" width="490" height="62"/><text class="t" x="890" y="372" text-anchor="middle">Movement, Economy, Production, Eras, Vision, Wildlife,</text><text class="t" x="890" y="389" text-anchor="middle">UnitBehavior, Combat, Orders, Placement, Roads, Victory</text>
  <rect class="box" x="645" y="422" width="490" height="36"/><text class="t" x="890" y="445" text-anchor="middle">GameMap, Fog, Defs</text>

  <rect class="box" x="625" y="480" width="170" height="40"/><text class="t" x="710" y="497" text-anchor="middle">Tick driver</text><text class="s" x="710" y="512" text-anchor="middle">gives it time (Main today)</text>
  <rect class="prop" x="815" y="500" width="340" height="60"/><text class="t" x="985" y="524" text-anchor="middle">Update publisher</text><text class="s" x="985" y="542" text-anchor="middle">proposed: signals today; later state or the ordered commands</text>

  <path class="l" d="M680,95 L680,150"/><path class="l" d="M820,95 L820,150"/>
  <path class="l" d="M755,220 L755,260"/>
  <path class="d" d="M885,185 L940,185"/><text class="s" x="912" y="178" text-anchor="middle">submitted</text>
  <path class="d" d="M1047,260 L1047,220"/><text class="s" x="1085" y="245">stepped</text>
  <path class="l" d="M710,480 L710,470"/>
  <path class="d" d="M985,470 L985,500"/><text class="s" x="1020" y="490">signals</text>
  <path class="l" d="M290,215 L625,215"/>
  <path class="l" d="M815,545 L290,545"/>
</svg>
