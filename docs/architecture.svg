<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1425" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1425"/>

  <!-- Person and the UI, with its headless client -->
  <rect class="box" x="240" y="20" width="520" height="45" rx="6"/><text class="t" x="500" y="40" text-anchor="middle">Person</text><text class="s" x="500" y="56" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>
  <rect class="grp" x="210" y="95" width="580" height="200" rx="10"/><text class="h" x="225" y="116">UI  (humans only)</text>
  <rect class="box" x="240" y="130" width="240" height="70" rx="6"/><text class="t" x="360" y="154" text-anchor="middle">Views</text><text class="s" x="360" y="172" text-anchor="middle">world, units, fog, minimap,</text><text class="s" x="360" y="186" text-anchor="middle">HUD readouts, messages</text>
  <rect class="box" x="520" y="130" width="240" height="70" rx="6"/><text class="t" x="640" y="154" text-anchor="middle">Controls</text><text class="s" x="640" y="172" text-anchor="middle">mouse, keys, selection, buttons:</text><text class="s" x="640" y="186" text-anchor="middle">make commands</text>
  <rect class="box" x="240" y="215" width="520" height="66" rx="6"/><text class="t" x="500" y="236" text-anchor="middle">Headless client  (the person's)</text><text class="s" x="500" y="254" text-anchor="middle">the player's fog-filtered model of the world; takes commands;</text><text class="s" x="500" y="269" text-anchor="middle">speaks queue: it attaches to its player's two queues</text>

  <!-- the link, when the person's client is on another machine -->
  <text class="s" x="280" y="400">view</text><text class="s" x="480" y="400">commands</text><text class="s" x="480" y="414">asynchronous, over the network</text>
  <text class="s" x="280" y="414">asynchronous, over the network</text><text class="s" x="480" y="428">(a client in the same process attaches to the queues directly)</text>

  <!-- Host -->
  <rect class="grp" x="30" y="445" width="1160" height="715" rx="10"/>
  <text class="h" x="45" y="1148">Host  (where the one simulation runs, and the AIs)</text>
  <rect class="box" x="640" y="470" width="320" height="55" rx="6"/><text class="t" x="800" y="494" text-anchor="middle">AIs</text><text class="s" x="800" y="512" text-anchor="middle">players run by the computer</text>
  <rect class="prop" x="180" y="560" width="380" height="55" rx="6"/><text class="t" x="370" y="583" text-anchor="middle">Networking  (NetSession)</text><text class="s" x="370" y="601" text-anchor="middle">a remote client talks to this; it talks to the two queues</text>
  <rect class="box" x="640" y="560" width="320" height="55" rx="6"/><text class="t" x="800" y="583" text-anchor="middle">Headless client</text><text class="s" x="800" y="601" text-anchor="middle">one for each AI; attaches to its queues</text>

  <!-- the simulation: its interface is the queues -->
  <rect class="sim" x="45" y="640" width="955" height="470" rx="10"/>
  <text class="h" x="60" y="663">Simulation</text><text class="s" x="985" y="1100" text-anchor="end">src/sim: no scene, no clock</text>
  <rect class="prop" x="180" y="675" width="170" height="55" rx="6"/><text class="t" x="265" y="698" text-anchor="middle">View queue</text><text class="s" x="265" y="716" text-anchor="middle">the person's: its latest view</text>
  <rect class="prop" x="380" y="675" width="170" height="55" rx="6"/><text class="t" x="465" y="698" text-anchor="middle">Command queue</text><text class="s" x="465" y="716" text-anchor="middle">the person's: due ticks</text>
  <rect class="prop" x="640" y="675" width="150" height="55" rx="6"/><text class="t" x="715" y="698" text-anchor="middle">View queue</text><text class="s" x="715" y="716" text-anchor="middle">each AI's</text>
  <rect class="prop" x="810" y="675" width="150" height="55" rx="6"/><text class="t" x="885" y="698" text-anchor="middle">Command queue</text><text class="s" x="885" y="716" text-anchor="middle">each AI's</text>
  <rect class="box" x="180" y="765" width="780" height="140" rx="6"/><text class="t" x="570" y="788" text-anchor="middle">Simulation step   (one tick: 1/30 s of game time)</text><text class="s" x="570" y="812" text-anchor="middle">1  for each player, in order: drain its command queue, and have the</text><text class="s" x="570" y="828" text-anchor="middle">    systems validate and apply the commands that are due</text><text class="s" x="570" y="846" text-anchor="middle">2  run the systems over the state</text><text class="s" x="570" y="864" text-anchor="middle">3  for each player: build its view (the fog filter) and put it on its view queue</text><text class="s" x="570" y="890" text-anchor="middle">the loop is the tick driver running one step after another; world time is the tick count</text>
  <rect class="box" x="180" y="940" width="380" height="110" rx="6"/><text class="t" x="370" y="962" text-anchor="middle">Game systems</text><text class="s" x="370" y="984" text-anchor="middle">Commands, Movement, Economy, Production, Eras,</text><text class="s" x="370" y="1000" text-anchor="middle">Vision, Wildlife, UnitBehavior, Combat, Orders,</text><text class="s" x="370" y="1016" text-anchor="middle">Placement, Roads, Victory</text><text class="s" x="370" y="1038" text-anchor="middle">(the rules, run on the state)</text>
  <rect class="box" x="600" y="940" width="360" height="110" rx="6"/><text class="t" x="780" y="962" text-anchor="middle">Game state</text><text class="s" x="780" y="984" text-anchor="middle">units and their goals, buildings, stocks, fogs,</text><text class="s" x="780" y="1000" text-anchor="middle">rng, the tick count, GameMap, Fog, Defs</text><text class="s" x="780" y="1022" text-anchor="middle">(inert data)</text>

  <!-- right of the simulation -->
  <rect class="box" x="1030" y="770" width="150" height="130" rx="6"/><text class="t" x="1105" y="792" text-anchor="middle">Tick driver</text><text class="s" x="1105" y="812" text-anchor="middle">decides when steps</text><text class="s" x="1105" y="826" text-anchor="middle">run: at real time in</text><text class="s" x="1105" y="840" text-anchor="middle">play, as fast as it</text><text class="s" x="1105" y="854" text-anchor="middle">can in a test</text><text class="s" x="1105" y="876" text-anchor="middle">(Main; the harness)</text>

  <!-- Key -->
  <rect class="grp" x="30" y="1180" width="560" height="225" rx="10"/>
  <text class="h" x="45" y="1203">Key</text>
  <path class="l" d="M45,1223 L90,1223"/><text class="s" x="100" y="1227">a call, or data flowing</text>
  <path class="d" d="M45,1245 L90,1245"/><text class="s" x="100" y="1249">a tap that takes no part</text>
  <rect class="prop" x="45" y="1259" width="45" height="20" rx="4"/><text class="s" x="100" y="1273">proposed, not built</text>
  <text class="s" x="45" y="1301">Today the clients are built (one for the person, one for each AI) but read</text><text class="s" x="45" y="1316">and call the Simulation directly; the queues and Networking are not built.</text>
  <text class="s" x="45" y="1341">A queue holds what one player sends or is sent, in order. Each player has a pair.</text><text class="s" x="45" y="1356">Networking is only for a client on another machine; the AIs, and a person playing</text><text class="s" x="45" y="1371">in the host's process, attach to the queues directly.</text>

  <!-- arrows -->
  <path class="l" d="M640,65 L640,130"/><path class="l" d="M360,130 L360,65"/>
  <path class="l" d="M640,200 L640,215"/><path class="l" d="M360,215 L360,200"/>
  <path class="l" d="M265,560 L265,281"/><path class="l" d="M465,281 L465,560"/>
  <path class="l" d="M265,675 L265,615"/><path class="l" d="M465,615 L465,675"/>
  <path class="l" d="M715,675 L715,615"/><path class="l" d="M885,615 L885,675"/>
  <path class="l" d="M740,560 L740,525"/><path class="l" d="M860,525 L860,560"/>
  <path class="l" d="M465,730 L465,765"/><path class="l" d="M885,730 L885,765"/>
  <path class="l" d="M265,765 L265,730"/><path class="l" d="M715,765 L715,730"/>
  <path class="l" d="M370,905 L370,940"/>
  <path class="l" d="M560,995 L600,995"/>
  <path class="d" d="M780,940 L780,905"/><text class="s" x="795" y="928">reads, for the views</text>
  <path class="l" d="M1030,835 L960,835"/>
</svg>
