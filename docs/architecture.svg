<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="830"/>

  <!-- Person -->
  <rect class="box" x="60" y="20" width="520" height="45" rx="6"/><text class="t" x="320" y="40" text-anchor="middle">Person</text><text class="s" x="320" y="56" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>

  <!-- Client -->
  <rect class="grp" x="30" y="95" width="580" height="120" rx="10"/>
  <text class="h" x="45" y="116">Client</text>
  <rect class="box" x="60" y="130" width="240" height="70" rx="6"/><text class="t" x="180" y="154" text-anchor="middle">Views</text><text class="s" x="180" y="172" text-anchor="middle">world, units, fog, minimap,</text><text class="s" x="180" y="186" text-anchor="middle">HUD readouts, messages</text>
  <rect class="box" x="340" y="130" width="240" height="70" rx="6"/><text class="t" x="460" y="154" text-anchor="middle">Controls</text><text class="s" x="460" y="172" text-anchor="middle">mouse, keys, selection, buttons:</text><text class="s" x="460" y="186" text-anchor="middle">make commands</text>

  <!-- Channels -->
  <rect class="prop" x="60" y="245" width="240" height="75" rx="6"/><text class="t" x="180" y="268" text-anchor="middle">View channel</text><text class="s" x="180" y="285" text-anchor="middle">asynchronous, host to client</text><text class="s" x="180" y="300" text-anchor="middle">in-process queue, or NetSession</text>
  <rect class="prop" x="340" y="245" width="240" height="75" rx="6"/><text class="t" x="460" y="268" text-anchor="middle">Command channel</text><text class="s" x="460" y="285" text-anchor="middle">asynchronous, client to host</text><text class="s" x="460" y="300" text-anchor="middle">in-process queue, or NetSession</text>

  <!-- Host -->
  <rect class="grp" x="30" y="345" width="1150" height="470" rx="10"/>
  <text class="h" x="1165" y="368" text-anchor="end">Host  (where the one simulation runs)</text>

  <!-- above the simulation: the ends of the channels, and the other drivers -->
  <rect class="prop" x="60" y="385" width="240" height="60" rx="6"/><text class="t" x="180" y="409" text-anchor="middle">View publisher</text><text class="s" x="180" y="427" text-anchor="middle">puts the signals on the channel</text>
  <rect class="prop" x="340" y="385" width="240" height="60" rx="6"/><text class="t" x="460" y="409" text-anchor="middle">Command receiver</text><text class="s" x="460" y="427" text-anchor="middle">takes commands off the channel</text>
  <rect class="box" x="640" y="385" width="120" height="60" rx="6"/><text class="t" x="700" y="420" text-anchor="middle">AIs</text>
  <rect class="box" x="780" y="385" width="120" height="60" rx="6"/><text class="t" x="840" y="420" text-anchor="middle">Replayer</text>

  <!-- the simulation -->
  <rect class="sim" x="45" y="480" width="915" height="320" rx="10"/>
  <text class="h" x="60" y="503">Simulation</text><text class="s" x="940" y="790" text-anchor="end">src/sim: no scene, no clock</text>
  <rect class="prop" x="340" y="520" width="600" height="50" rx="6"/><text class="t" x="640" y="542" text-anchor="middle">Command interface</text><text class="s" x="640" y="559" text-anchor="middle">accepts a command from anyone and queues it (today: Commands.submit, which answers at once)</text>
  <rect class="prop" x="340" y="595" width="600" height="50" rx="6"/><text class="t" x="640" y="617" text-anchor="middle">Command queue</text><text class="s" x="640" y="634" text-anchor="middle">drained at the start of each tick, in order</text>
  <rect class="box" x="340" y="670" width="600" height="50" rx="6"/><text class="t" x="640" y="692" text-anchor="middle">Commands</text><text class="s" x="640" y="709" text-anchor="middle">validate, pay, apply</text>

  <rect class="box" x="60" y="520" width="240" height="60" rx="6"/><text class="t" x="180" y="544" text-anchor="middle">Simulation.step()</text><text class="s" x="180" y="562" text-anchor="middle">units, buildings, stocks, fogs, rng</text>
  <rect class="box" x="60" y="595" width="240" height="100" rx="6"/><text class="s" x="180" y="620" text-anchor="middle">Movement, Economy, Production,</text><text class="s" x="180" y="638" text-anchor="middle">Eras, Vision, Wildlife,</text><text class="s" x="180" y="656" text-anchor="middle">UnitBehavior, Combat, Orders,</text><text class="s" x="180" y="674" text-anchor="middle">Placement, Roads, Victory</text>
  <rect class="box" x="60" y="730" width="240" height="40" rx="6"/><text class="s" x="180" y="755" text-anchor="middle">GameMap, Fog, Defs</text>

  <rect class="box" x="1010" y="600" width="160" height="130" rx="6"/><text class="t" x="1090" y="645" text-anchor="middle">Recorder</text><text class="s" x="1090" y="663" text-anchor="middle">writes the commands</text><text class="s" x="1090" y="677" text-anchor="middle">and checksums</text><text class="s" x="1090" y="691" text-anchor="middle">to a file</text>

  <!-- Key -->
  <rect class="grp" x="650" y="95" width="530" height="120" rx="10"/>
  <text class="h" x="665" y="116">Key</text>
  <path class="l" d="M670,138 L720,138"/><text class="s" x="730" y="142">a call</text>
  <path class="d" d="M670,160 L720,160"/><text class="s" x="730" y="164">a signal, or a listener that does not take part</text>
  <rect class="prop" x="670" y="174" width="50" height="24" rx="4"/><text class="s" x="730" y="186">proposed, not built. Today the Controls, AIs and Replayer call</text>
  <text class="s" x="730" y="201">Commands directly, and Views read the Simulation directly.</text>

  <!-- arrows -->
  <path class="l" d="M460,65 L460,130"/>
  <path class="l" d="M180,130 L180,65"/>
  <path class="l" d="M460,200 L460,245"/>
  <path class="l" d="M180,245 L180,200"/>
  <path class="l" d="M460,320 L460,385"/>
  <path class="l" d="M460,445 L460,520"/>
  <path class="l" d="M700,445 L700,520"/>
  <path class="l" d="M840,445 L840,520"/>
  <path class="l" d="M640,570 L640,595"/>
  <path class="l" d="M640,645 L640,670"/>
  <path class="l" d="M340,695 L300,695"/>
  <path class="l" d="M180,520 L180,445"/>
  <path class="l" d="M180,385 L180,320"/>
  <path class="d" d="M940,695 L1010,695"/><text class="s" x="975" y="688" text-anchor="middle">submitted</text>
  <path class="d" d="M960,625 L1010,625"/><text class="s" x="985" y="618" text-anchor="middle">stepped</text>
</svg>
