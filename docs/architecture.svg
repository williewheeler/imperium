<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1400"/>

  <!-- Person and the UI, with its headless client -->
  <rect class="box" x="340" y="20" width="520" height="45" rx="6"/><text class="t" x="600" y="40" text-anchor="middle">Person</text><text class="s" x="600" y="56" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>
  <rect class="grp" x="210" y="95" width="780" height="190" rx="10"/><text class="h" x="225" y="116">UI  (humans only)</text>
  <rect class="box" x="240" y="130" width="240" height="70" rx="6"/><text class="t" x="360" y="154" text-anchor="middle">Views</text><text class="s" x="360" y="172" text-anchor="middle">world, units, fog, minimap,</text><text class="s" x="360" y="186" text-anchor="middle">HUD readouts, messages</text>
  <rect class="box" x="520" y="130" width="240" height="70" rx="6"/><text class="t" x="640" y="154" text-anchor="middle">Controls</text><text class="s" x="640" y="172" text-anchor="middle">mouse, keys, selection, buttons:</text><text class="s" x="640" y="186" text-anchor="middle">make commands</text>
  <rect class="box" x="240" y="215" width="710" height="55" rx="6"/><text class="t" x="595" y="237" text-anchor="middle">Headless client  (the person's)</text><text class="s" x="595" y="255" text-anchor="middle">the player's fog-filtered model of the world; takes commands; talks to the host through its end of an asynchronous link</text>

  <!-- Key -->
  <g transform="translate(-800 1150)"><rect class="grp" x="830" y="20" width="350" height="215" rx="10"/>
  <text class="h" x="845" y="42">Key</text>
  <path class="l" d="M845,62 L890,62"/><text class="s" x="900" y="66">a call, or data flowing</text>
  <path class="d" d="M845,84 L890,84"/><text class="s" x="900" y="88">a tap that takes no part</text>
  <rect class="prop" x="845" y="98" width="45" height="20" rx="4"/><text class="s" x="900" y="112">proposed, not built</text>
  <text class="s" x="845" y="142">Today the clients are built (one for the person,</text><text class="s" x="845" y="157">one for each AI) but read and call the Simulation</text><text class="s" x="845" y="172">directly: the links, the publisher, the receiver and</text><text class="s" x="845" y="187">the queue are not built.</text>
  <text class="s" x="845" y="212">A link is asynchronous: an in-process queue, or</text><text class="s" x="845" y="227">NetSession.</text></g>

  <!-- the links between the person's client and the host -->
  <text class="s" x="265" y="345">view link</text><text class="s" x="265" y="359">asynchronous: in-process, or NetSession</text>
  <text class="s" x="755" y="345">command link</text><text class="s" x="755" y="359">asynchronous: in-process, or NetSession</text>

  <!-- Host -->
  <rect class="grp" x="30" y="425" width="1150" height="720" rx="10"/>
  <text class="h" x="1165" y="1130" text-anchor="end">Host  (where the one simulation runs, and the AIs)</text>
  <rect class="box" x="340" y="455" width="240" height="60" rx="6"/><text class="t" x="460" y="480" text-anchor="middle">AIs</text><text class="s" x="460" y="498" text-anchor="middle">players run by the computer</text>
  <rect class="prop" x="60" y="545" width="240" height="60" rx="6"/><text class="t" x="180" y="569" text-anchor="middle">View publisher</text><text class="s" x="180" y="587" text-anchor="middle">sends each player what it may see</text>
  <rect class="box" x="340" y="545" width="240" height="60" rx="6"/><text class="t" x="460" y="569" text-anchor="middle">Headless client</text><text class="s" x="460" y="587" text-anchor="middle">one for each AI</text>
  <rect class="prop" x="620" y="545" width="240" height="60" rx="6"/><text class="t" x="740" y="569" text-anchor="middle">Command receiver</text><text class="s" x="740" y="587" text-anchor="middle">takes each player's commands</text>
  <text class="s" x="460" y="628" text-anchor="middle">the AIs' links are in process</text>

  <rect class="sim" x="45" y="640" width="820" height="470" rx="10"/>
  <text class="h" x="60" y="663">Simulation</text><text class="s" x="850" y="1100" text-anchor="end">src/sim: no scene, no clock</text>
  <rect class="prop" x="340" y="675" width="500" height="60" rx="6"/><text class="t" x="590" y="698" text-anchor="middle">Command interface</text><text class="s" x="590" y="715" text-anchor="middle">accepts a command from any player or the Replayer, with the</text><text class="s" x="590" y="728" text-anchor="middle">tick it is due (default: next); today Commands.submit, answering at once</text>
  <rect class="prop" x="340" y="755" width="500" height="50" rx="6"/><text class="t" x="590" y="777" text-anchor="middle">Command queue</text><text class="s" x="590" y="794" text-anchor="middle">holds each command with its due tick, in order</text>
  <rect class="box" x="340" y="830" width="500" height="250" rx="6"/><text class="t" x="590" y="853" text-anchor="middle">Game loop   (Simulation.step)</text><text class="s" x="590" y="879" text-anchor="middle">each tick, 1/30 s of game time:</text><text class="s" x="590" y="898" text-anchor="middle">1  drain the commands now due from the queue</text><text class="s" x="590" y="914" text-anchor="middle">    and have the systems validate and apply them</text><text class="s" x="590" y="932" text-anchor="middle">2  run the systems over the state</text><text class="s" x="590" y="949" text-anchor="middle">3  the state publishes what changed</text><text class="s" x="590" y="987" text-anchor="middle">world time is the tick count; it moves only</text><text class="s" x="590" y="1003" text-anchor="middle">when the tick driver runs a tick</text>
  <rect class="box" x="60" y="830" width="240" height="110" rx="6"/><text class="t" x="180" y="853" text-anchor="middle">Game state</text><text class="s" x="180" y="875" text-anchor="middle">units and their goals,</text><text class="s" x="180" y="891" text-anchor="middle">buildings, stocks, fogs,</text><text class="s" x="180" y="907" text-anchor="middle">rng, the tick count,</text><text class="s" x="180" y="923" text-anchor="middle">GameMap, Fog, Defs</text>
  <rect class="box" x="60" y="975" width="240" height="105" rx="6"/><text class="t" x="180" y="996" text-anchor="middle">Game systems</text><text class="s" x="180" y="1016" text-anchor="middle">Commands, Movement, Economy,</text><text class="s" x="180" y="1032" text-anchor="middle">Production, Eras, Vision,</text><text class="s" x="180" y="1048" text-anchor="middle">Wildlife, UnitBehavior, Combat,</text><text class="s" x="180" y="1064" text-anchor="middle">Orders, Placement, Roads, Victory</text>

  <!-- right of the simulation -->
  <rect class="box" x="900" y="640" width="170" height="60" rx="6"/><text class="t" x="985" y="663" text-anchor="middle">Replayer</text><text class="s" x="985" y="681" text-anchor="middle">drives the interface</text>
  <rect class="box" x="900" y="715" width="250" height="70" rx="6"/><text class="t" x="1025" y="737" text-anchor="middle">Recorder</text><text class="s" x="1025" y="755" text-anchor="middle">taps the interface: writes each</text><text class="s" x="1025" y="769" text-anchor="middle">command with its due tick</text>
  <rect class="box" x="900" y="950" width="250" height="90" rx="6"/><text class="t" x="1025" y="980" text-anchor="middle">Tick driver</text><text class="s" x="1025" y="1000" text-anchor="middle">turns wall-clock time into ticks</text><text class="s" x="1025" y="1015" text-anchor="middle">(Main, the headless runner)</text>

  <!-- arrows -->
  <path class="l" d="M640,65 L640,130"/><path class="l" d="M360,130 L360,65"/>
  <path class="l" d="M640,200 L640,215"/><path class="l" d="M360,215 L360,200"/>
  <path class="l" d="M250,545 L250,270"/>
  <path class="l" d="M740,270 L740,545"/>
  <path class="l" d="M410,545 L410,515"/><path class="l" d="M510,515 L510,545"/>
  <path class="l" d="M300,575 L340,575"/><path class="l" d="M580,575 L620,575"/>
  <path class="l" d="M740,605 L740,675"/>
  <path class="l" d="M590,735 L590,755"/>
  <path class="l" d="M590,805 L590,830"/>
  <path class="d" d="M180,830 L180,605"/><text class="s" x="195" y="720">state and events</text>
  <path class="l" d="M180,975 L180,940"/>
  <path class="l" d="M340,1030 L300,1030"/>
  <path class="l" d="M900,995 L840,995"/>
  <path class="l" d="M900,690 L840,690"/>
  <path class="d" d="M840,725 L900,725"/>
</svg>
