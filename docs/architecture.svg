<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1100"/>

  <!-- Person, UI, AIs -->
  <rect class="box" x="60" y="20" width="520" height="45" rx="6"/><text class="t" x="320" y="40" text-anchor="middle">Person</text><text class="s" x="320" y="56" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>
  <rect class="grp" x="30" y="95" width="580" height="120" rx="10"/><text class="h" x="45" y="116">UI  (humans only)</text>
  <rect class="box" x="60" y="130" width="240" height="70" rx="6"/><text class="t" x="180" y="154" text-anchor="middle">Views</text><text class="s" x="180" y="172" text-anchor="middle">world, units, fog, minimap,</text><text class="s" x="180" y="186" text-anchor="middle">HUD readouts, messages</text>
  <rect class="box" x="340" y="130" width="240" height="70" rx="6"/><text class="t" x="460" y="154" text-anchor="middle">Controls</text><text class="s" x="460" y="172" text-anchor="middle">mouse, keys, selection, buttons:</text><text class="s" x="460" y="186" text-anchor="middle">make commands</text>
  <rect class="box" x="650" y="120" width="250" height="80" rx="6"/><text class="t" x="775" y="154" text-anchor="middle">AIs</text><text class="s" x="775" y="173" text-anchor="middle">players run by the computer</text>

  <!-- Headless client -->
  <rect class="prop" x="30" y="245" width="900" height="75" rx="6"/><text class="t" x="480" y="270" text-anchor="middle">Headless client  (one per player, human or AI)</text><text class="s" x="480" y="289" text-anchor="middle">holds the player's fog-filtered model of the world, and takes commands. The UI and the AIs both work through it,</text><text class="s" x="480" y="304" text-anchor="middle">so a human and an AI see and do the same things. Built for the AIs (src/client); the UI still reads the Simulation directly.</text>

  <!-- Channels -->
  <rect class="prop" x="60" y="350" width="240" height="75" rx="6"/><text class="t" x="180" y="373" text-anchor="middle">View channel</text><text class="s" x="180" y="390" text-anchor="middle">asynchronous, host to client</text><text class="s" x="180" y="405" text-anchor="middle">in-process queue, or NetSession</text>
  <rect class="prop" x="470" y="350" width="240" height="75" rx="6"/><text class="t" x="590" y="373" text-anchor="middle">Command channel</text><text class="s" x="590" y="390" text-anchor="middle">asynchronous, client to host</text><text class="s" x="590" y="405" text-anchor="middle">in-process queue, or NetSession</text>

  <!-- Host -->
  <rect class="grp" x="30" y="455" width="1150" height="625" rx="10"/>
  <text class="h" x="1165" y="478" text-anchor="end">Host  (where the one simulation runs)</text>
  <rect class="prop" x="60" y="495" width="240" height="60" rx="6"/><text class="t" x="180" y="519" text-anchor="middle">View publisher</text><text class="s" x="180" y="537" text-anchor="middle">sends each player what it may see</text>
  <rect class="prop" x="470" y="495" width="240" height="60" rx="6"/><text class="t" x="590" y="519" text-anchor="middle">Command receiver</text><text class="s" x="590" y="537" text-anchor="middle">takes commands off the channel</text>

  <rect class="sim" x="45" y="590" width="820" height="470" rx="10"/>
  <text class="h" x="60" y="613">Simulation</text><text class="s" x="850" y="1050" text-anchor="end">src/sim: no scene, no clock</text>
  <rect class="prop" x="340" y="625" width="500" height="60" rx="6"/><text class="t" x="590" y="648" text-anchor="middle">Command interface</text><text class="s" x="590" y="665" text-anchor="middle">accepts a command from any player or the Replayer, with the</text><text class="s" x="590" y="678" text-anchor="middle">tick it is due (default: next); today Commands.submit, answering at once</text>
  <rect class="prop" x="340" y="705" width="500" height="50" rx="6"/><text class="t" x="590" y="727" text-anchor="middle">Command queue</text><text class="s" x="590" y="744" text-anchor="middle">holds each command with its due tick, in order</text>
  <rect class="box" x="340" y="780" width="500" height="250" rx="6"/><text class="t" x="590" y="803" text-anchor="middle">Game loop   (Simulation.step)</text><text class="s" x="590" y="829" text-anchor="middle">each tick, 1/30 s of game time:</text><text class="s" x="590" y="848" text-anchor="middle">1  drain the commands now due from the queue</text><text class="s" x="590" y="864" text-anchor="middle">    and have the systems validate and apply them</text><text class="s" x="590" y="882" text-anchor="middle">2  run the systems over the state</text><text class="s" x="590" y="899" text-anchor="middle">3  the state publishes what changed</text><text class="s" x="590" y="937" text-anchor="middle">world time is the tick count; it moves only</text><text class="s" x="590" y="953" text-anchor="middle">when the tick driver runs a tick</text>
  <rect class="box" x="60" y="780" width="240" height="110" rx="6"/><text class="t" x="180" y="803" text-anchor="middle">Game state</text><text class="s" x="180" y="825" text-anchor="middle">units and their goals,</text><text class="s" x="180" y="841" text-anchor="middle">buildings, stocks, fogs,</text><text class="s" x="180" y="857" text-anchor="middle">rng, the tick count,</text><text class="s" x="180" y="873" text-anchor="middle">GameMap, Fog, Defs</text>
  <rect class="box" x="60" y="925" width="240" height="105" rx="6"/><text class="t" x="180" y="946" text-anchor="middle">Game systems</text><text class="s" x="180" y="966" text-anchor="middle">Commands, Movement, Economy,</text><text class="s" x="180" y="982" text-anchor="middle">Production, Eras, Vision,</text><text class="s" x="180" y="998" text-anchor="middle">Wildlife, UnitBehavior, Combat,</text><text class="s" x="180" y="1014" text-anchor="middle">Orders, Placement, Roads, Victory</text>

  <!-- to the right of the simulation -->
  <rect class="box" x="900" y="595" width="250" height="60" rx="6"/><text class="t" x="1025" y="618" text-anchor="middle">Replayer</text><text class="s" x="1025" y="636" text-anchor="middle">drives the interface from a recording</text>
  <rect class="box" x="900" y="670" width="250" height="70" rx="6"/><text class="t" x="1025" y="691" text-anchor="middle">Recorder</text><text class="s" x="1025" y="709" text-anchor="middle">taps the interface: writes each command</text><text class="s" x="1025" y="723" text-anchor="middle">with its due tick, and a checksum every 5 s</text>
  <rect class="box" x="900" y="900" width="250" height="90" rx="6"/><text class="t" x="1025" y="930" text-anchor="middle">Tick driver</text><text class="s" x="1025" y="950" text-anchor="middle">turns wall-clock time into ticks</text><text class="s" x="1025" y="965" text-anchor="middle">(Main, the headless runner)</text>

  <!-- Key -->
  <rect class="grp" x="940" y="20" width="240" height="195" rx="10"/>
  <text class="h" x="955" y="42">Key</text>
  <path class="l" d="M955,62 L1000,62"/><text class="s" x="1010" y="66">a call, or data flowing</text>
  <path class="d" d="M955,84 L1000,84"/><text class="s" x="1010" y="88">a tap that takes no part</text>
  <rect class="prop" x="955" y="98" width="45" height="20" rx="4"/><text class="s" x="1010" y="112">proposed, not built</text>
  <text class="s" x="955" y="140">Today the AIs work through a</text><text class="s" x="955" y="155">headless client; the Controls call</text><text class="s" x="955" y="170">Commands and the Views read the</text><text class="s" x="955" y="185">Simulation directly; no channels.</text>

  <!-- arrows -->
  <path class="l" d="M460,65 L460,130"/><path class="l" d="M180,130 L180,65"/>
  <path class="l" d="M460,200 L460,245"/><path class="l" d="M180,245 L180,200"/>
  <path class="l" d="M700,245 L700,200"/><path class="l" d="M850,200 L850,245"/>
  <path class="l" d="M590,320 L590,350"/><path class="l" d="M180,350 L180,320"/>
  <path class="l" d="M590,425 L590,495"/><path class="l" d="M180,495 L180,425"/>
  <path class="l" d="M590,555 L590,625"/>
  <path class="l" d="M590,685 L590,705"/>
  <path class="l" d="M590,755 L590,780"/>
  
  <path class="l" d="M340,975 L300,975"/>
  <path class="l" d="M180,925 L180,890"/>
  <path class="d" d="M180,780 L180,555"/><text class="s" x="195" y="680">state and events</text>
  <path class="d" d="M840,678 L900,678"/>
  <path class="l" d="M900,630 L840,630"/>
  <path class="l" d="M900,945 L840,945"/>
</svg>
