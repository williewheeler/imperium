<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1495" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grp{fill:#f3f1ea;stroke:#9a9a9a;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#444;stroke-width:1.5}
      .sim{fill:#e6eef7;stroke:#4f78a6;stroke-width:1.5}
      .prop{fill:#fff4cc;stroke:#b8901a;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#1c1c1c}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1c1c1c;font-size:14px}
      .l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#333;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .ah{fill:#333}
      @media (prefers-color-scheme: dark) {
        .bg{fill:#1b1b1d}
        .grp{fill:#26262a;stroke:#7d7d85}
        .box{fill:#303036;stroke:#b4b4bc}
        .sim{fill:#1d2b3b;stroke:#7aa2d4}
        .prop{fill:#3b3315;stroke:#d9b94a}
        .t{fill:#f0f0f2}.s{fill:#b8b8c0}.h{fill:#f0f0f2}
        .l,.d{stroke:#d0d0d6}
        .ah{fill:#d0d0d6}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1500" height="1495"/>

  <!-- a remote human, on another machine -->
  <rect class="grp" x="30" y="20" width="400" height="285" rx="10"/><text class="h" x="45" y="42">A remote human  (another machine)</text>
  <rect class="box" x="60" y="58" width="340" height="45" rx="6"/><text class="t" x="230" y="78" text-anchor="middle">Person</text><text class="s" x="230" y="94" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>
  <rect class="box" x="60" y="130" width="340" height="60" rx="6"/><text class="t" x="230" y="152" text-anchor="middle">UI</text><text class="s" x="230" y="170" text-anchor="middle">Views and Controls</text>
  <rect class="box" x="60" y="218" width="340" height="66" rx="6"/><text class="t" x="230" y="239" text-anchor="middle">Headless client</text><text class="s" x="230" y="257" text-anchor="middle">the player's end of the queues: sends commands, holds its</text><text class="s" x="230" y="272" text-anchor="middle">latest view, runs the rules on it (through Networking)</text>
  <path class="l" d="M140,130 L140,103"/><path class="l" d="M320,103 L320,130"/>
  <path class="l" d="M140,218 L140,190"/><path class="l" d="M320,190 L320,218"/>

  <!-- Host -->
  <rect class="grp" x="20" y="345" width="1460" height="870" rx="10"/>
  <text class="h" x="35" y="1203">Host  (where the one simulation runs; the local human and the AIs play in its process)</text>

  <!-- a local human, in the host's process -->
  <rect class="grp" x="470" y="370" width="400" height="270" rx="10"/><text class="h" x="485" y="392">A local human  (the host's own player)</text>
  <rect class="box" x="490" y="405" width="360" height="40" rx="6"/><text class="t" x="670" y="422" text-anchor="middle">Person</text><text class="s" x="670" y="437" text-anchor="middle">looks at the screen, uses the mouse and keyboard</text>
  <rect class="box" x="490" y="470" width="360" height="55" rx="6"/><text class="t" x="670" y="492" text-anchor="middle">UI</text><text class="s" x="670" y="510" text-anchor="middle">Views and Controls</text>
  <rect class="box" x="490" y="555" width="360" height="66" rx="6"/><text class="t" x="670" y="577" text-anchor="middle">Headless client</text><text class="s" x="670" y="595" text-anchor="middle">the player's end of the queues: sends commands, holds its</text><text class="s" x="670" y="610" text-anchor="middle">latest view, runs the rules on it (attaches directly)</text>
  <path class="l" d="M572,470 L572,445"/><path class="l" d="M767,445 L767,470"/>
  <path class="l" d="M572,555 L572,525"/><path class="l" d="M767,525 L767,555"/>

  <!-- the AIs, in the host's process -->
  <rect class="box" x="910" y="440" width="320" height="55" rx="6"/><text class="t" x="1070" y="464" text-anchor="middle">AIs</text><text class="s" x="1070" y="482" text-anchor="middle">players run by the computer</text>
  <rect class="box" x="910" y="555" width="320" height="66" rx="6"/><text class="t" x="1070" y="577" text-anchor="middle">Headless client</text><text class="s" x="1070" y="595" text-anchor="middle">one for each AI: its end of the queues, sends commands,</text><text class="s" x="1070" y="610" text-anchor="middle">holds its latest view, runs the rules on it</text>
  <path class="l" d="M980,555 L980,495"/><path class="l" d="M1160,495 L1160,555"/>

  <!-- Networking, for the remote human -->
  <rect class="box" x="60" y="555" width="340" height="66" rx="6"/><text class="t" x="230" y="577" text-anchor="middle">Networking  (NetSession)</text><text class="s" x="230" y="595" text-anchor="middle">the remote client talks to this; it uses</text><text class="s" x="230" y="610" text-anchor="middle">the command queue and its view queue</text>
  <path class="l" d="M140,555 L140,284"/><path class="l" d="M320,284 L320,555"/>

  <!-- the simulation: its interface is the queues -->
  <rect class="sim" x="45" y="665" width="1225" height="495" rx="10"/>
  <text class="h" x="60" y="688">Simulation</text><text class="s" x="1255" y="1150" text-anchor="end">src/sim: no scene, no clock</text>
  <rect class="box" x="60" y="705" width="160" height="55" rx="6"/><text class="t" x="140" y="728" text-anchor="middle">View queue</text><text class="s" x="140" y="746" text-anchor="middle">the remote human's</text>
  <rect class="box" x="495" y="705" width="160" height="55" rx="6"/><text class="t" x="575" y="728" text-anchor="middle">View queue</text><text class="s" x="575" y="746" text-anchor="middle">the local human's</text>
  <rect class="box" x="1085" y="705" width="150" height="55" rx="6"/><text class="t" x="1160" y="728" text-anchor="middle">View queue</text><text class="s" x="1160" y="746" text-anchor="middle">each AI's</text>
  <rect class="box" x="240" y="775" width="820" height="40" rx="6"/><text class="t" x="410" y="792" text-anchor="middle">Command queue</text><text class="s" x="410" y="808" text-anchor="middle">one, for every player</text><text class="s" x="830" y="798" text-anchor="middle">each command carries its player and its due tick</text>
  <rect class="box" x="60" y="840" width="1175" height="140" rx="6"/><text class="t" x="647" y="863" text-anchor="middle">Simulation step   (one tick: 1/30 s of game time)</text><text class="s" x="647" y="887" text-anchor="middle">1  drain the command queue: the systems validate and apply the commands that are due, in player order, each for its player</text><text class="s" x="647" y="905" text-anchor="middle">2  run the systems over the state</text><text class="s" x="647" y="923" text-anchor="middle">3  for each player: build its view (the fog filter) and put it on that player's view queue</text><text class="s" x="647" y="949" text-anchor="middle">the loop is the tick driver running one step after another; world time is the tick count</text>
  <rect class="box" x="60" y="1020" width="540" height="110" rx="6"/><text class="t" x="330" y="1042" text-anchor="middle">Game systems</text><text class="s" x="330" y="1064" text-anchor="middle">Commands, Movement, Economy, Production, Eras,</text><text class="s" x="330" y="1080" text-anchor="middle">Vision, Wildlife, UnitBehavior, Combat, Orders,</text><text class="s" x="330" y="1096" text-anchor="middle">Placement, Roads, Victory</text><text class="s" x="330" y="1118" text-anchor="middle">(the rules, run on the state)</text>
  <rect class="box" x="640" y="1020" width="595" height="110" rx="6"/><text class="t" x="937" y="1042" text-anchor="middle">Game state</text><text class="s" x="937" y="1064" text-anchor="middle">units and their goals, buildings, stocks, fogs,</text><text class="s" x="937" y="1080" text-anchor="middle">rng, the tick count, GameMap, Fog, Defs</text><text class="s" x="937" y="1102" text-anchor="middle">(inert data)</text>

  <!-- right of the simulation -->
  <rect class="box" x="1295" y="850" width="170" height="130" rx="6"/><text class="t" x="1380" y="872" text-anchor="middle">Tick driver</text><text class="s" x="1380" y="892" text-anchor="middle">decides when steps</text><text class="s" x="1380" y="906" text-anchor="middle">run: at real time in</text><text class="s" x="1380" y="920" text-anchor="middle">play, as fast as it</text><text class="s" x="1380" y="934" text-anchor="middle">can in a test</text><text class="s" x="1380" y="956" text-anchor="middle">(Main; the harness)</text>

  <!-- Key -->
  <rect class="grp" x="30" y="1235" width="620" height="235" rx="10"/>
  <text class="h" x="45" y="1258">Key</text>
  <path class="l" d="M45,1278 L90,1278"/><text class="s" x="100" y="1282">a call, or data flowing</text>
  <path class="d" d="M45,1300 L90,1300"/><text class="s" x="100" y="1304">a read that changes nothing</text>
  
  <text class="s" x="45" y="1356">Built: the clients (one for the local human, one for each AI), the queues,</text><text class="s" x="45" y="1371">the ground and fog in the views, and the rules on the client.</text><text class="s" x="45" y="1386">Everything in the picture is built, and it plays over the network.</text>
  <text class="s" x="45" y="1411">Each player has a view queue, because each is sent only what it may see. Commands share one queue:</text><text class="s" x="45" y="1426">Networking sets a remote command's player from the connection. Networking is only for a client on</text><text class="s" x="45" y="1441">another machine; the AIs, and a human in the host's process, attach to the queues directly.</text>

  <!-- arrows -->
  <text class="s" x="130" y="318" text-anchor="end">view: asynchronous,</text><text class="s" x="130" y="332" text-anchor="end">over the network</text><text class="s" x="335" y="318">commands: asynchronous,</text><text class="s" x="335" y="332">over the network</text>
  <path class="l" d="M140,705 L140,621"/><path class="l" d="M320,621 L320,775"/>
  <path class="l" d="M575,705 L575,621"/><path class="l" d="M767,621 L767,775"/>
  <path class="l" d="M1160,705 L1160,621"/><path class="l" d="M980,621 L980,775"/>
  <path class="l" d="M140,840 L140,760"/><path class="l" d="M575,840 L575,760"/><path class="l" d="M1160,840 L1160,760"/>
  <path class="l" d="M700,815 L700,840"/>
  <path class="l" d="M330,980 L330,1020"/>
  <path class="l" d="M600,1075 L640,1075"/>
  <path class="d" d="M900,1020 L900,980"/><text class="s" x="915" y="1004">reads, for the views</text>
  <path class="l" d="M1295,910 L1235,910"/>
</svg>
